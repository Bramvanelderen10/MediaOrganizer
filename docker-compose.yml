services:
  media-organizer:
    image: ghcr.io/bramvanelderen10/mediaorganizer:0.0.13
    container_name: media-organizer
    ports:
      - "45263:45263"
    # Hardware transcoding: give the container access to the Intel GPU render node so
    # ffmpeg can use VA-API (h264_vaapi) or Quick Sync (h264_qsv). Requires /dev/dri on
    # the host (run `ls -l /dev/dri`). Remove this block and set Transcoding__Encoder to
    # libx264 (or Transcoding__Enabled to false) when the host has no GPU.
    devices:
      - /dev/dri:/dev/dri
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Europe/Amsterdam
      - MediaOrganizer__SourceFolder=/media
      - MediaOrganizer__MoveHistoryDatabasePath=/data/move-history.db
      # qBittorrent integration: lets POST /torrents/add hand a .torrent file to qBittorrent.
      # "qbittorrent" resolves through the shared local-network below.
      - MediaOrganizer__Qbittorrent__Url=http://qbittorrent:8488
      - MediaOrganizer__Qbittorrent__Username=admin
      # Set the permanent WebUI password here after the first login (see README).
      - MediaOrganizer__Qbittorrent__Password=change-me
      # Must be a path qBittorrent can see. /media is the same bind mount in both services,
      # so downloads land in the folder that the organizer scans.
      - MediaOrganizer__Qbittorrent__DownloadFolder=/media
      # Match these to the UID/GID of the host user that owns your media files.
      # This ensures moved files are not owned by root, preventing SMB lock-out.
      # Run `id` on your host to find the right values.
      - PUID=1000
      - PGID=1000
      # --- Optional codec transcoding (e.g. HEVC -> H.264) for hosts that cannot play HEVC ---
      # Scans the media library and re-encodes files that are not already in the target codec.
      # Triggered on demand via POST /transcode (or the button in the companion app).
      - MediaOrganizer__Transcoding__Enabled=true
      # h264_vaapi works with most Intel GPUs (5th gen+). Use h264_qsv for Quick Sync or
      # libx264 for pure CPU encoding (no /dev/dri needed, much slower).
      - MediaOrganizer__Transcoding__Encoder=h264_vaapi
      - MediaOrganizer__Transcoding__HardwareDevice=/dev/dri/renderD128
      # Match these to the host groups that own /dev/dri (run: ls -ln /dev/dri).
      - VIDEO_GID=44
      - RENDER_GID=992
      # 5th-gen (Broadwell) / older Intel GPUs: uncomment to use the legacy i965 driver.
      # - LIBVA_DRIVER_NAME=i965
    restart: unless-stopped
    volumes:
      # Replace /path/to/your/videos with the host folder holding your media.
      # Keeping both under one mount ensures moves are fast renames (same filesystem).
      - /path/to/your/videos:/media
      # Binds the history DB next to this compose file, so backing up ./data is enough.
      - ./data:/data
    depends_on:
      - qbittorrent
    networks:
      - local-network

  # Optional: remove this service if you already run qBittorrent elsewhere.
  # If you keep it, point MediaOrganizer__Qbittorrent__Url at wherever qBittorrent runs.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      # WEBUI_PORT must match both sides of the port mapping below (CSRF protection).
      - WEBUI_PORT=8488
      - TORRENTING_PORT=6881
    ports:
      # Exposes the WebUI on your LAN. Use "127.0.0.1:8488:8488" to keep it local;
      # MediaOrganizer reaches qBittorrent over the compose network either way.
      - "8488:8488"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      # Keep this identical to the media-organizer mount so save paths line up.
      - /path/to/your/videos:/media
      - qbittorrent-config:/config
    restart: unless-stopped
    networks:
      - local-network

volumes:
  qbittorrent-config:


networks:
  local-network:
    driver: bridge
